name: Sync stable → v2.x (PR)

on:
  schedule:
    # Offset from main→stable (06:00) so the stream hop usually lands first.
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    uses: ./.github/workflows/sync-via-pr.yaml
    secrets:
      GHA_SECRET_PAT: ${{ secrets.GHA_SECRET_PAT }}
    permissions:
      contents: write
    with:
      source: stable
      target: v2.x
      merge_branch: sync/stable-to-v2.x
      pr_title: "chore: sync stable → v2.x"
      pr_body: |
        Automated daily sync of `stable` into `v2.x`.

        **What this PR does**
        - Merges all commits from `stable` that are not yet in `v2.x`.
        - Keeps the `v2.x` version of `.tekton/` and the known version-pinned files.

        **Review checklist**
        - [ ] Diff looks as expected (no unintended version bumps or config changes)
        - [ ] CI is green

        > Generated by the *Sync stable → v2.x (PR)* workflow.
